name: icteach
description: "A Learning Management System for TVL-ICT Students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # 🔥 Firebase (Core + Services)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0

  # 📧 Email Service (for sending credentials)
  emailjs: ^4.0.0

  # 🌐 HTTP & Networking
  http: ^1.6.0
  crypto: ^3.0.6

  # 📁 File & Media Pickers
  file_picker: ^11.0.3
  image_picker: ^1.0.4

  # 🔗 URL Launcher (for videos, files, external links)
  url_launcher: ^6.2.1
  uuid: ^4.5.3
  webview_flutter: ^4.4.2

  connectivity_plus: ^5.0.1  # ✅ For network connectivity
  youtube_player_flutter: ^10.0.1
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  fl_chart: ^1.2.0
  mobile_scanner: ^7.4.0
  flutter_svg: ^2.1.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.3
  pdf: ^3.12.0
  printing: ^5.14.3

  # ❌ REMOVED: webview_flutter (caused build errors)
  # Use url_launcher instead – more reliable and free-plan friendly

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo 2.png
    - assets/ict_logo.png
    - assets/fonts/
    - assets/simulations/
    # Add any other assets here
